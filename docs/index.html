<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Cloud Consultant Academy - Learn Salesforce Service Cloud</title>
  <meta name="description" content="Interactive, self-paced course: 17 modules covering the full Salesforce Service Cloud Consultant blueprint - case management, entitlements, Omni-Channel, knowledge, service console, Einstein, and certification prep." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9745;</text></svg>" />
  <link rel="stylesheet" href="assets/style.css?v=3" />
  <script>
    (function() {
      var t = localStorage.getItem('sccacademy-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <a class="skip-link" href="#view">Skip to content</a>

  <div class="shell">

    <aside class="sidebar" aria-label="Course navigation">
      <!-- filled by app.js -->
    </aside>

    <div class="content">

      <header class="topbar">
        <i class="readbar" id="readBar" aria-hidden="true"></i>
        <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="sidebarNav">&#9776;</button>
        <a class="brand" href="#/">
          <span class="logo">&#9745;</span>
          <span class="brand-text">
            <b>Service Cloud</b><small>Consultant Academy</small>
          </span>
        </a>
        <div class="tb-search">
          <input id="topSearch" type="search" placeholder="Search lessons, concepts.  (press /)" autocomplete="off" />
          <span class="kbd">/</span>
        </div>
        <div class="tb-meter" title="Roadmap progress">
          <div class="tb-bar"><i id="topBar"></i></div>
          <span id="topPct" class="tb-pct">0%</span>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">&#127769;</button>
      </header>

      <main id="view"></main>

      <footer class="footer">
        <span>Service Cloud Consultant learning academy &middot; API 68.0</span>
        <span>&middot;</span>
        <span>Progress is saved in your browser</span>
      </footer>

    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="assets/curriculum.js?v=3"></script>
  <script src="assets/answers.js?v=3"></script>
  <script src="assets/app.js?v=3"></script>
</body>
</html>
